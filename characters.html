<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>캐릭터 도감</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;900&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; padding: 24px 16px 40px; background: #141a22; color: #f4ead8;
      font-family: system-ui, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
    h1 { margin: 0 0 4px; font-family: 'Noto Serif KR', serif; font-weight: 900; font-size: 28px; }
    .sub { margin: 0 0 24px; opacity: .7; font-size: 14px; }
    .grid { display: grid; grid-template-columns: auto repeat(3, minmax(0, 1fr)); gap: 12px; max-width: 1100px; }
    .head { font-family: 'Noto Serif KR', serif; font-weight: 900; font-size: 18px; align-self: end; text-align: center; }
    .row-label { font-family: 'Noto Serif KR', serif; font-weight: 900; font-size: 20px; writing-mode: vertical-rl;
      display: grid; place-items: center; padding: 0 4px; border-radius: 6px; }
    .cell { background: #1e2530; border: 2px solid #050507; border-radius: 6px; padding: 10px; text-align: center; }
    .cell img { width: 100%; display: block; border: 2px solid #050507; box-shadow: 0 0 0 1px #7a705e; }
    .cell img.full { height: 240px; width: auto; max-width: 100%; margin: 0 auto; object-fit: contain; border: 0; box-shadow: none;
      background: radial-gradient(ellipse at 50% 90%, #2e3644, #1e2530 70%); }
    .cell .wait { font-size: 11px; color: #e0b04a; margin-top: 6px; }
    .cell .t { font-family: 'Noto Serif KR', serif; font-weight: 900; margin: 8px 0 2px; }
    .cell .n { font-size: 12px; opacity: .75; line-height: 1.45; }
  </style>
</head>
<body>
  <h1>캐릭터 도감</h1>
  <p class="sub">세력 3 × 계열 3 · 전신 그림이 준비된 캐릭터는 전투용 그림, 나머지는 스타일 참고 샘플</p>
  <div class="grid" id="grid"></div>
  <h1 style="margin-top:28px">이야기 인물</h1>
  <div class="grid npc" id="npc"></div>
  <script type="module">
    import { DESIGNS, FACTIONS, CLASSES, NPC_IDS } from './src/ui/characters.js';
    const grid = document.getElementById('grid');
    grid.append(document.createElement('div'));
    for (const c of Object.values(CLASSES)) {
      const h = document.createElement('div'); h.className = 'head'; h.textContent = c.name; grid.append(h);
    }
    for (const [fid, f] of Object.entries(FACTIONS)) {
      const label = document.createElement('div');
      label.className = 'row-label'; label.textContent = f.name; label.style.background = f.color + '55';
      grid.append(label);
      for (const cid of Object.keys(CLASSES)) {
        const d = DESIGNS[`${fid}-${cid}`];
        const cell = document.createElement('div'); cell.className = 'cell';
        const img = d.sprite
          ? `<img class="full" src="${d.sprite.image}" alt="${d.title}">`
          : `<img src="${d.portrait}" alt="${d.title}"><div class="wait">전신 그림 대기 중 (스타일 참고 샘플)</div>`;
        cell.innerHTML = `${img}<div class="t">${d.title}</div><div class="n">${d.note}</div>`;
        grid.append(cell);
      }
    }
    const npc = document.getElementById('npc');
    npc.style.gridTemplateColumns = 'repeat(3, 1fr)';
    for (const key of NPC_IDS) {
      const d = DESIGNS[key];
      if (!d.sprite) {
        const cell = document.createElement('div'); cell.className = 'cell';
        cell.innerHTML = `<div class="wait">그림 대기 중</div><div class="t">${d.title}</div><div class="n">${d.note}</div>`;
        npc.append(cell);
        continue;
      }
      const cell = document.createElement('div'); cell.className = 'cell';
      cell.innerHTML = `<img class="full" src="${d.sprite.image}" alt="${d.title}"><div class="t">${d.title}</div><div class="n">${d.note}</div>`;
      npc.append(cell);
    }
  </script>
</body>
</html>
