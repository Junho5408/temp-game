<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#120d18">
  <title>백일회귀 (temp-game)</title>
  <meta name="description" content="억울하게 죽은 그날로부터 백 일 전. 회귀하며 강해지는 무협 카드 배틀 로그라이트.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='6' fill='%23120d18' stroke='%23b3262e' stroke-width='5'/%3E%3Ctext x='32' y='45' font-size='34' text-anchor='middle' fill='%23e8c46a' font-family='serif' font-weight='900'%3E%E7%99%BE%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage" data-screen="map">
    <canvas id="scene"></canvas>

    <!-- 전투 화면 -->
    <div class="battle-ui">
      <div id="intent" class="intent"></div>

      <div id="enemy-info" class="unit-info"></div>
      <div id="player-info" class="unit-info"></div>

      <div id="bag" title="행낭: 눌러서 사용 (내공 안 씀)"></div>
      <div id="energy" title="내공"><span id="energy-value">3/3</span><small>내공</small></div>
      <div id="hand"></div>

      <div id="piles">
        <span id="draw-count" title="뽑을 패">뽑을 패 10</span>
        <span id="discard-count" title="버린 패">버린 패 0</span>
      </div>
      <button id="end-turn" type="button">턴 종료</button>
    </div>

    <!-- 지도 -->
    <div id="map-screen" hidden></div>

    <!-- 위쪽 정보 (모든 화면 공통) -->
    <div id="topbar">
      <span class="zone">제1구역 · 후기지수 비무대회</span>
      <span id="treasures" title="보물 (영구 효과)"></span>
      <span class="run-info">
        <span id="bag-top" title="행낭 (전투 중에 한 번 쓰는 물품)"></span>
        <span id="run-hp" title="체력">❤ 60/60</span>
        <span id="run-gold" title="은자">銀 60</span>
        <button id="deck-button" type="button" title="덱 보기">덱 10</button>
        <span id="turn-label"></span>
      </span>
    </div>
    <button id="sound-button" type="button" title="소리 설정">音</button>

    <div id="sound-panel" hidden>
      <label>배경음 <input type="range" min="0" max="100" data-kind="music"></label>
      <label>효과음 <input type="range" min="0" max="100" data-kind="sfx"></label>
    </div>

    <div id="popups"></div>
    <div id="flash"></div>
    <div id="namecard"></div>
    <div id="bigword"></div>
    <div id="fade"></div>
    <div id="banner"></div>

    <!-- 보상 · 운기조식 · 객잔 · 기연 · 결과 -->
    <div id="panel" hidden></div>
    <div id="deck-modal" hidden></div>

    <!-- 이야기: 튜토리얼 도움말 · 대사 · 타이틀/선택 화면 · 회귀 연출 -->
    <div id="hint" hidden></div>
    <div id="dialogue" hidden></div>
    <div id="flow" hidden></div>
    <div id="regress" hidden></div>
  </div>
  <!-- 휴대폰 세로 화면: 가로로 돌려 달라는 안내 (BUG-007) -->
  <div id="rotate">
    <div class="rotate-phone"></div>
    <p>가로로 돌려 주세요</p>
    <small>백일회귀는 가로 화면에서 즐기는 게임입니다</small>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
