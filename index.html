<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>temp-game · 후기지수 비무대회</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <canvas id="scene" width="960" height="540"></canvas>

    <div id="topbar">
      <span class="zone">제1구역 · 후기지수 비무대회</span>
      <span id="turn-label">제 1 턴</span>
    </div>

    <div id="intent" class="intent"></div>

    <div id="enemy-info" class="unit-info"></div>
    <div id="player-info" class="unit-info"></div>

    <div id="energy" title="내공"><span id="energy-value">3/3</span><small>내공</small></div>
    <div id="hand"></div>

    <div id="piles">
      <span id="draw-count" title="뽑을 패">뽑을 패 10</span>
      <span id="discard-count" title="버린 패">버린 패 0</span>
    </div>
    <button id="end-turn" type="button">턴 종료</button>

    <div id="popups"></div>
    <div id="banner"></div>

    <div id="result" hidden>
      <div class="result-box">
        <h2 id="result-title"></h2>
        <p id="result-text"></p>
        <button id="restart" type="button">다시 하기</button>
      </div>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
